spring:
  application:
    name: smartspender

  # ==================== Database ====================
  datasource:
    url: "jdbc:postgresql://localhost:5432/smartspender"
    username: "smartspender"
    password: "smartspender"
    driver-class-name: org.postgresql.Driver

  # ==================== JPA / Hibernate ====================
  jpa:
    hibernate:
      # IMPORTANT: 'validate' means Hibernate checks entities match Flyway schema.
      # Never use 'update' once Flyway is in charge — it causes drift.
      ddl-auto: validate
    show-sql: true
    properties:
      dialect: org.hibernate.dialect.PostgreSQLDialect
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false   # Prevents lazy-loading surprises in controllers

  # ==================== Flyway ====================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    schemas: public
    create-schemas: true

  # ==================== Jackson (JSON) ====================
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

# ==================== Server ====================
server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# ==================== API Docs ====================
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

# ==================== Logging ====================
logging:
  level:
    root: INFO
    com.smartspender: DEBUG
    org.flywaydb: DEBUG          # <-- change INFO to DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

# ==================== App-specific ====================
app:
  jwt:
    # DEV ONLY. Override via env var APP_JWT_SECRET in real environments.
    secret: "dev-only-change-me-super-secret-key-that-is-long-enough-for-hs256"
    expiration-ms: 86400000   # 24 hours
  cors:
    allowed-origins: "http://localhost:5173"
  ai:
    enabled: false             # Toggle AI categorization on later
    api-key: ""